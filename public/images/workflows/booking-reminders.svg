<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">Appointment booking and reminder map</title><desc id="desc">An illustrative appointment workflow with intake, confirmation, reminders, and reschedule or post-call follow-up paths.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111b2d"/><stop offset="1" stop-color="#1b2a40"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#060b14" flood-opacity=".24"/></filter></defs><rect width="1440" height="900" rx="34" fill="url(#bg)"/><circle cx="1260" cy="70" r="260" fill="#233b50" opacity=".38"/><text x="88" y="100" fill="#f2bd78" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="4">GOHIGHLEVEL · BOOKING AUTOMATION</text><text x="88" y="164" fill="#fff" font-family="Arial,sans-serif" font-size="46" font-weight="700">From booking to a better-prepared call.</text><text x="88" y="205" fill="#b9c7d7" font-family="Arial,sans-serif" font-size="22">Intake, reminders, and follow-through connect into one calm appointment journey.</text><path d="M300 410H422M626 410H748M952 410H1040V340H1090M1040 410V590H1090" fill="none" stroke="#70889f" stroke-width="4"/><path d="m410 398 16 12-16 12m318-24 16 12-16 12m338-94 16 12-16 12m-16 158 16 12-16 12" fill="none" stroke="#f2bd78" stroke-width="4"/><g filter="url(#shadow)"><rect x="88" y="340" width="212" height="140" rx="20" fill="#fff"/><rect x="422" y="340" width="204" height="140" rx="20" fill="#fff"/><rect x="748" y="340" width="204" height="140" rx="20" fill="#fff"/><rect x="1090" y="280" width="250" height="120" rx="20" fill="#fff"/><rect x="1090" y="530" width="250" height="120" rx="20" fill="#fff"/></g><g font-family="Arial,sans-serif"><g fill="#d78b42"><circle cx="124" cy="380" r="14"/><circle cx="458" cy="380" r="14"/><circle cx="784" cy="380" r="14"/></g><g fill="#fff" font-size="13" font-weight="700"><text x="119" y="385">01</text><text x="453" y="385">02</text><text x="779" y="385">03</text></g><g fill="#142033" font-size="19" font-weight="700"><text x="114" y="425">Choose a time</text><text x="448" y="425">Intake captured</text><text x="774" y="425">Confirm &amp; remind</text><text x="1116" y="328">Appointment held</text><text x="1116" y="578">Change or no-show</text></g><g fill="#66768b" font-size="15"><text x="114" y="452">Self-serve calendar</text><text x="448" y="452">Context in CRM</text><text x="774" y="452">Instant · 24h · 1h</text><text x="1116" y="358">Post-call follow-up</text><text x="1116" y="608">Reschedule sequence</text></g></g><rect x="88" y="710" width="1252" height="72" rx="18" fill="#263a50"/><circle cx="126" cy="746" r="10" fill="#83c8b5"/><text x="154" y="741" fill="#fff" font-family="Arial,sans-serif" font-size="17" font-weight="700">A smoother experience on both sides of the calendar</text><text x="154" y="766" fill="#c0cbd8" font-family="Arial,sans-serif" font-size="15">Fewer manual reminders · useful prep before the call · clear next step afterwards</text><text x="88" y="832" fill="#b9c7d7" font-family="Arial,sans-serif" font-size="16">Illustrative appointment pattern · Reminder timing can be tailored to the business</text></svg>