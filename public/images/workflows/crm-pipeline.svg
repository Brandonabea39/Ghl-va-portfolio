<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">CRM pipeline system map</title><desc id="desc">An illustrative pipeline showing clear lead stages, ownership, and next actions.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111b2d"/><stop offset="1" stop-color="#1b2a40"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#060b14" flood-opacity=".24"/></filter></defs><rect width="1440" height="900" rx="34" fill="url(#bg)"/><circle cx="1260" cy="60" r="260" fill="#233b50" opacity=".38"/><text x="88" y="100" fill="#f2bd78" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="4">GOHIGHLEVEL · CRM SYSTEM MAP</text><text x="88" y="164" fill="#fff" font-family="Arial,sans-serif" font-size="46" font-weight="700">A pipeline your team can trust.</text><text x="88" y="205" fill="#b9c7d7" font-family="Arial,sans-serif" font-size="22">Clear stages, useful fields, and ownership that keeps the next step visible.</text><g filter="url(#shadow)"><rect x="88" y="330" width="232" height="310" rx="20" fill="#fff"/><rect x="346" y="330" width="232" height="310" rx="20" fill="#fff"/><rect x="604" y="330" width="232" height="310" rx="20" fill="#fff"/><rect x="862" y="330" width="232" height="310" rx="20" fill="#fff"/><rect x="1120" y="330" width="232" height="310" rx="20" fill="#fff"/></g><g font-family="Arial,sans-serif"><g fill="#d78b42"><rect x="88" y="330" width="232" height="8" rx="4"/><rect x="346" y="330" width="232" height="8" rx="4"/><rect x="604" y="330" width="232" height="8" rx="4"/><rect x="862" y="330" width="232" height="8" rx="4"/><rect x="1120" y="330" width="232" height="8" rx="4"/></g><g fill="#142033" font-size="18" font-weight="700"><text x="112" y="385">New lead</text><text x="370" y="385">Contacted</text><text x="628" y="385">Qualified</text><text x="886" y="385">Appointment</text><text x="1144" y="385">Won / nurture</text></g><g fill="#77869a" font-size="14"><text x="112" y="413">Source captured</text><text x="370" y="413">Owner assigned</text><text x="628" y="413">Fit confirmed</text><text x="886" y="413">Show / reschedule</text><text x="1144" y="413">Outcome recorded</text></g><g fill="#f0f4f7"><rect x="108" y="450" width="192" height="64" rx="12"/><rect x="366" y="450" width="192" height="64" rx="12"/><rect x="624" y="450" width="192" height="64" rx="12"/><rect x="882" y="450" width="192" height="64" rx="12"/><rect x="1140" y="450" width="192" height="64" rx="12"/></g><g fill="#46586c" font-size="14"><text x="126" y="478">Name · source · intent</text><text x="384" y="478">First response logged</text><text x="642" y="478">Need · budget · timing</text><text x="900" y="478">Calendar status</text><text x="1158" y="478">Reason · next touch</text></g><g fill="#f2bd78"><circle cx="132" cy="564" r="5"/><circle cx="390" cy="564" r="5"/><circle cx="648" cy="564" r="5"/><circle cx="906" cy="564" r="5"/><circle cx="1164" cy="564" r="5"/></g><g fill="#64758a" font-size="14"><text x="146" y="569">Deduplicate</text><text x="404" y="569">Follow-up task</text><text x="662" y="569">Route by fit</text><text x="920" y="569">Reminders</text><text x="1178" y="569">Re-engage</text></g></g><path d="M320 365h26m232 0h26m232 0h26m232 0h26" stroke="#f2bd78" stroke-width="3"/><path d="m338 357 10 8-10 8m232-16 10 8-10 8m232-16 10 8-10 8m232-16 10 8-10 8" fill="none" stroke="#f2bd78" stroke-width="3"/><rect x="88" y="772" width="1264" height="1" fill="#718096" opacity=".35"/><text x="88" y="822" fill="#b9c7d7" font-family="Arial,sans-serif" font-size="17">Illustrative CRM pattern · Stages and fields reflect the real sales process</text><text x="1176" y="816" fill="#f2bd78" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="1">ONE SOURCE OF TRUTH</text></svg>