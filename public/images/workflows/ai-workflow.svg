<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">AI-assisted workflow map</title><desc id="desc">An illustrative customer conversation path with AI response, qualification, booking, and a human handoff for sensitive or uncertain requests.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111b2d"/><stop offset="1" stop-color="#1b2a40"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#060b14" flood-opacity=".24"/></filter></defs><rect width="1440" height="900" rx="34" fill="url(#bg)"/><circle cx="1260" cy="70" r="260" fill="#233b50" opacity=".38"/><text x="88" y="100" fill="#f2bd78" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="4">GOHIGHLEVEL · AI AUTOMATION MAP</text><text x="88" y="164" fill="#fff" font-family="Arial,sans-serif" font-size="46" font-weight="700">Fast answers. Clear human handoff.</text><text x="88" y="205" fill="#b9c7d7" font-family="Arial,sans-serif" font-size="22">AI handles the repeatable first mile; people take the moments that need judgment.</text><g filter="url(#shadow)"><rect x="88" y="360" width="230" height="148" rx="20" fill="#fff"/><rect x="414" y="360" width="230" height="148" rx="20" fill="#fff"/><rect x="740" y="360" width="230" height="148" rx="20" fill="#fff"/><rect x="1080" y="300" width="250" height="128" rx="20" fill="#fff"/><rect x="1080" y="540" width="250" height="128" rx="20" fill="#fff"/></g><path d="M318 434H414M644 434H740M970 434H1030V364H1080M1030 434V604H1080" fill="none" stroke="#71899f" stroke-width="4"/><path d="m402 422 16 12-16 12m660-94 16 12-16 12m-16 158 16 12-16 12" fill="none" stroke="#f2bd78" stroke-width="4"/><g font-family="Arial,sans-serif"><g fill="#d78b42"><circle cx="124" cy="400" r="14"/><circle cx="450" cy="400" r="14"/><circle cx="776" cy="400" r="14"/></g><g fill="#fff" font-size="13" font-weight="700"><text x="119" y="405">01</text><text x="445" y="405">02</text><text x="771" y="405">03</text></g><g fill="#142033" font-size="19" font-weight="700"><text x="114" y="448">New conversation</text><text x="440" y="448">AI replies</text><text x="766" y="448">Intent &amp; confidence</text><text x="1106" y="351">Ready to book</text><text x="1106" y="591">Needs a person</text></g><g fill="#66768b" font-size="15"><text x="114" y="477">SMS · chat · social</text><text x="440" y="477">Approved knowledge</text><text x="766" y="477">Qualify or route</text><text x="1106" y="382">Offer calendar · log</text><text x="1106" y="622">Assign with context</text></g></g><rect x="88" y="730" width="1242" height="1" fill="#718096" opacity=".35"/><text x="88" y="790" fill="#b9c7d7" font-family="Arial,sans-serif" font-size="17">Illustrative AI pattern · Human escalation is an explicit part of the design</text><rect x="1090" y="758" width="240" height="46" rx="23" fill="#263c52"/><text x="1120" y="787" fill="#83c8b5" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1">GUARDRAILS INCLUDED</text></svg>