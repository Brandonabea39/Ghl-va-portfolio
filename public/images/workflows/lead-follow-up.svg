<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">Lead follow-up workflow map</title><desc id="desc">An illustrative automation map from enquiry capture through acknowledgement, engagement checks, and pipeline updates.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111b2d"/><stop offset="1" stop-color="#1b2a40"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#060b14" flood-opacity=".24"/></filter></defs><rect width="1440" height="900" rx="34" fill="url(#bg)"/><circle cx="1240" cy="70" r="260" fill="#233b50" opacity=".38"/><text x="88" y="100" fill="#f2bd78" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="4">GOHIGHLEVEL · WORKFLOW MAP</text><text x="88" y="164" fill="#fff" font-family="Arial,sans-serif" font-size="46" font-weight="700">Lead follow-up, handled.</text><text x="88" y="205" fill="#b9c7d7" font-family="Arial,sans-serif" font-size="22">A considered cadence that responds quickly and routes each lead with context.</text><path d="M300 410H400M610 410H710M920 410H1020M1130 470V560H920M710 620H610" fill="none" stroke="#6f879d" stroke-width="4" stroke-linecap="round"/><path d="m390 398 16 12-16 12M700 398l16 12-16 12M1010 398l16 12-16 12M932 548l-16 12 16 12M620 608l-16 12 16 12" fill="none" stroke="#f2bd78" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><g filter="url(#shadow)"><rect x="88" y="340" width="212" height="140" rx="20" fill="#fff"/><rect x="400" y="340" width="210" height="140" rx="20" fill="#fff"/><rect x="710" y="340" width="210" height="140" rx="20" fill="#fff"/><rect x="1020" y="340" width="220" height="140" rx="20" fill="#fff"/><rect x="710" y="560" width="210" height="120" rx="20" fill="#fff"/></g><g font-family="Arial,sans-serif"><g fill="#d78b42"><circle cx="122" cy="380" r="14"/><circle cx="434" cy="380" r="14"/><circle cx="744" cy="380" r="14"/><circle cx="1054" cy="380" r="14"/><circle cx="744" cy="600" r="14"/></g><g fill="#fff" font-size="13" font-weight="700"><text x="117" y="385">01</text><text x="429" y="385">02</text><text x="739" y="385">03</text><text x="1049" y="385">04</text><text x="739" y="605">05</text></g><g fill="#142033" font-size="19" font-weight="700"><text x="112" y="425">New enquiry</text><text x="424" y="425">Instant reply</text><text x="734" y="425">Wait &amp; check</text><text x="1044" y="425">Next best action</text><text x="734" y="645">Pipeline update</text></g><g fill="#65758a" font-size="15"><text x="112" y="451">Form, chat or call</text><text x="424" y="451">Email + SMS</text><text x="734" y="451">Reply, click, booking</text><text x="1044" y="451">Follow up or notify</text><text x="734" y="669">Stage stays current</text></g></g><rect x="88" y="772" width="1264" height="1" fill="#718096" opacity=".35"/><text x="88" y="822" fill="#b9c7d7" font-family="Arial,sans-serif" font-size="17">Illustrative workflow pattern · Adapted to each business process</text><rect x="1168" y="786" width="184" height="48" rx="24" fill="#263c52"/><text x="1196" y="816" fill="#f2bd78" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="1">CAPTURE → CARE</text></svg>